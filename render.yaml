services:
  - type: web
    name: todo-app
    runtime: node
    plan: starter          # persistent disks need a paid plan; free plan loses data on restart
    buildCommand: echo ok
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: todo-data
      mountPath: /var/data
      sizeGB: 1
